name: Claude Code Review

# stage 1 (unprivileged). runs on every PR, including PRs from forks and
# dependabot, which get a read-only token and no secrets here. it only saves
# the PR number; "Claude Code Review (run)" picks it up via workflow_run and
# does the review in this repository's context.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# no token rights for any job in this file, including jobs added later.
permissions: {}

jobs:
  prepare:
    if: github.event.pull_request.draft == false
    # job-level so a run skipped by the `if` above never cancels a running one.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Save PR number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > pr-number.txt

      - name: Upload PR number
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-number
          path: pr-number.txt
          retention-days: 1
          if-no-files-found: error
