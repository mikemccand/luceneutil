# TEMPORARY (do not merge): isolate Python 3.15 vs OS for CI's wrong float64 numpy results
name: Diagnose numpy compiler

on:
  push:
    branches:
      - 'diag-numpy-blas'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: py3.13 + numpy 2.2.3 from source (gcc-15, no BLAS)
            python: '3.13'
            numpy: 'numpy==2.2.3'
            nobinary: '--no-binary numpy'
          - name: py3.15.2 + newest numpy
            python: '3.15.2'
            numpy: 'numpy'
            nobinary: ''
          - name: py3.15.2 + newest numpy from source
            python: '3.15.2'
            numpy: 'numpy'
            nobinary: '--no-binary numpy'
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install numpy
        run: |
          python -m venv .venv
          .venv/bin/pip install -q --no-cache-dir ${{ matrix.nobinary }} "${{ matrix.numpy }}"
          .venv/bin/python -c "import numpy, sys; print(sys.version, numpy.__version__)"
      - name: Diagnose
        run: .venv/bin/python .github/diag/numpy_matmul_check.py
