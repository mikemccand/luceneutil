name: Claude Code Review

# stage 1 (unprivileged). runs on every PR, including PRs from forks and
# dependabot, which get a read-only token and no secrets here. it only saves
# the PR number; "Claude Code Review (run)" picks it up via workflow_run and
# does the review in this repository's context.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Save PR number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > pr-number.txt

      - name: Upload PR number
        uses: actions/upload-artifact@v4
        with:
          name: pr-number
          path: pr-number.txt
          retention-days: 1
